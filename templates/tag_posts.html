{{define "content"}}
  <header class="page-head">
    <h1 class="page-title"><span class="sr-only">Topic: </span><span class="hash" aria-hidden="true">#</span>{{.Tag}}</h1>
    <p class="page-dek">{{template "index-articles" len .Blogs}} tagged {{.Tag}}{{if gt (len .Blogs) 1}}, newest first{{end}}.</p>
  </header>
  <section aria-labelledby="tagged-title">
    <h2 id="tagged-title" class="sr-only">Articles</h2>
    <ol class="entries">
      {{- range .Blogs}}
      {{- template "index-entry" dict "Post" . "Layout" "2 Jan 2006" "Desc" true "Rel" ""}}
      {{- end}}
    </ol>
  </section>
  <p class="more"><a href="/tags">All topics</a></p>
{{end}}
