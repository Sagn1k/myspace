{{define "content"}}
  <header class="page-head">
    <h1 class="page-title">Topics</h1>
    <p class="page-dek">Every subject the writing touches, most written-about first.</p>
  </header>
  {{- with .Tags}}
  <ol class="topic-index">
    {{- range .}}
    <li><a href="/tags/{{pathEscape .Name}}">{{.Name}}{{if gt .Count 1}} <span class="n">{{.Count}}<span class="sr-only"> articles</span></span>{{end}}</a></li>
    {{- end}}
  </ol>
  {{- else}}
  <p class="empty">No topics yet. <a href="/blog">Browse the writing</a>.</p>
  {{- end}}
{{end}}
